version = 1

[scan]
roots = ["src"]
include = ["**/*.lua", "**/*.luau"]
exclude = [
  ".git/**",
  "build/**",
  "node_modules/**",
  "Packages/**",
  "ServerPackages/**",
  "**/generated/**",
